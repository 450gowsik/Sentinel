# ============================================================
# SENTINEL (PRAVAHA) — Docker Compose Stack
# FastAPI (GPU) + Redis + PostgreSQL + Prometheus + Grafana
# ============================================================

version: "3.9"

services:
  # ── SENTINEL Backend (GPU) ──────────────────────────────
  sentinel-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    container_name: sentinel-api
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel_db
      - INFLUXDB_URL=http://influxdb:8086
      - CUDA_DEVICE=0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── InfluxDB ───────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: sentinel-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: sentinel
      DOCKER_INFLUXDB_INIT_PASSWORD: sentinel-password
      DOCKER_INFLUXDB_INIT_ORG: sentinel
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: sentinel-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

  # ── Prometheus ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sentinel
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # ── MongoDB ────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: sentinel-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentinel
      MONGO_INITDB_ROOT_PASSWORD: sentinel
      MONGO_INITDB_DATABASE: sentinel_detections
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  influxdb-data:
  grafana-data:
  mongodb-data:
