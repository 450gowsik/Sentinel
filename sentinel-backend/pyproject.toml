[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-backend"
version = "2.0.0"
description = "SENTINEL (PRAVAHA) — Real-Time Crowd Surge Intelligence Platform"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SENTINEL Team"}]

dependencies = [
    # --- Core Framework ---
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",

    # --- AI / ML ---
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.1.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",

    # --- Inference ---
    # tensorrt — installed via NVIDIA apt/pip; not on PyPI
    "onnxruntime-gpu>=1.16.0",

    # --- Data & Events ---
    "redis[hiredis]>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "influxdb-client[async]>=1.38.0",

    # --- Config & Validation ---
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # --- Observability ---
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "structlog>=23.2.0",

    # --- Utilities ---
    "pillow>=10.0.0",
    "aiofiles>=23.2.0",
    "orjson>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
